name: controle_dividas
description: Aplicativo para controle de dívidas e pagamentos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.0
  sqflite: ^2.3.0
  path: ^1.8.3
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  file_picker: ^8.0.0
  pdf: ^3.10.4
  printing: ^5.11.0
  brasil_fields: ^1.15.0
  flutter_contacts: ^1.1.9
  shared_preferences: ^2.2.2

  # --- NOVAS DEPENDÊNCIAS PARA NOTIFICAÇÃO ---
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  # -------------------------------------------

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true