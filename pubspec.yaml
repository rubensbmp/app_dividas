name: app_dividas
description: "Gerenciador de Dividas Faca e Bainha"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Interface e Utilidades ---
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.0

  # --- Banco de Dados ---
  sqflite: ^2.3.0
  path: ^1.9.0


  # --- Notificações ---
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2

  # --- Backup ---
  share_plus: ^10.0.0
  file_picker: ^8.0.0

  # --- PDF e Impressão ---
  pdf: ^3.11.0
  printing: ^5.13.0
  brasil_fields: ^1.15.0
  flutter_contacts: ^1.1.9

  # --- Contatos (A linha que estava dando problema) ---



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

# Configuração do Ícone
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true